[package]
name = "tauri-app"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

[lib]
name = "tauri_app"
crate-type = ["cdylib"]

[[bin]]
name = "tauri-app"
path = "src/main.rs"
required-features = ["pytauri/standalone"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-pytauri = "0.7"

# PyTauri
pytauri = { version = "0.7", features = ["standalone"] }
pyo3 = { version = "0.25" }
